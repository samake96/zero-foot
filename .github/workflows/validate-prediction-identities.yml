name: Validate prediction team identities
on:
  pull_request:
    paths:
      - 'scripts/generate_live_predictions.py'
      - 'scripts/diagnose_team_matches.py'
      - 'scripts/test_team_identity.py'
      - 'data/historical_matches.json'
      - 'data/prediction_fixtures.json'
      - '.github/workflows/validate-prediction-identities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q scripts/generate_live_predictions.py scripts/diagnose_team_matches.py scripts/test_team_identity.py
      - name: Test verified club identities
        run: python -m unittest discover -s scripts -p 'test_team_identity.py' -v
