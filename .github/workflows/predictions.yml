name: Update ZEROFOOT previews
on:
  workflow_dispatch:
  schedule:
    - cron: '40 7,19 * * *'
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build previews
        run: python scripts/update_predictions.py
      - name: Commit preview data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ZEROFOOT previews"
            git push
          fi
