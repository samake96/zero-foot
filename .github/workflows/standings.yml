name: Update football standings
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6,18 * * *'
permissions:
  contents: write
concurrency:
  group: zerofoot-standings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_standings.py
      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update football standings"
            git push
          fi
