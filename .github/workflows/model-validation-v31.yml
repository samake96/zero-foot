name: Validate ZEROFOOT statistical model V3.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate model on historical matches
        run: python scripts/zerofoot_model_v31.py
      - name: Commit evaluation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model_validation_v31.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ZEROFOOT V3.1 validation'
            git push
          fi
