name: Update football news
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS headlines
        run: python scripts/update_news.py
      - name: Commit updates
        run: |
          git config user.name 'zerofoot-bot'
          git config user.email 'zerofoot-bot@users.noreply.github.com'
          git add data/news.json
          git diff --cached --quiet || (git commit -m 'Update football headlines' && git push)
