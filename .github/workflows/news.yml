name: Update football news
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news.py'
      - 'scripts/news_signals.py'
      - 'scripts/build_news_page.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS headlines
        run: |
          python scripts/update_news.py
          python scripts/build_news_page.py
      - name: Commit updates
        run: |
          git config user.name 'zerofoot-bot'
          git config user.email 'zerofoot-bot@users.noreply.github.com'
          git add data/news.json actualites/index.html
          git diff --cached --quiet || (git commit -m 'Update football headlines' && git pull --rebase origin main && git push)
