name: Generate ZEROFOOT experimental forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate forecasts
        run: python scripts/generate_live_predictions.py
      - name: Commit output only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update experimental forecasts'
            git push
          fi
