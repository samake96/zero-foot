name: Generate ZEROFOOT experimental forecasts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-predictions.yml'
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: write
concurrency:
  group: zerofoot-experimental-forecasts
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test team identity mappings
        run: python -m unittest discover -s scripts -p 'test_team_identity.py' -v
      - name: Verify current-season historical data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          matches = json.loads(Path('data/historical_matches.json').read_text(encoding='utf-8'))['matches']
          ids = [m['id'] for m in matches]
          recent = [m for m in matches if m.get('season') == 2026]
          assert len(ids) == len(set(ids)), 'Duplicate historical match IDs'
          assert recent, 'Missing 2026/27 completed matches'
          print(f'History validated: {len(matches)} total; {len(recent)} current-season matches')
          PY
      - name: Collect seven-day prediction calendar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_prediction_fixtures.py
      - name: Generate forecasts and audit
        run: python scripts/generate_live_predictions.py
      - name: Diagnose unmatched teams
        run: python scripts/diagnose_team_matches.py
      - name: Commit output only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prediction_fixtures.json data/live_predictions.json data/prediction_audit.json data/team_identity_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update experimental forecasts and audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
