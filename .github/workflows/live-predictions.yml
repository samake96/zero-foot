name: Generate ZEROFOOT experimental forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: write
concurrency:
  group: zerofoot-experimental-forecasts
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect seven-day prediction calendar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_prediction_fixtures.py
      - name: Generate forecasts and audit
        run: python scripts/generate_live_predictions.py
      - name: Diagnose unmatched teams
        run: python scripts/diagnose_team_matches.py
      - name: Commit output only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prediction_fixtures.json data/live_predictions.json data/prediction_audit.json data/team_identity_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update experimental forecasts and audit'
            git push
          fi
