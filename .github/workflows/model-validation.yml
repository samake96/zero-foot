name: Validate ZEROFOOT statistical model
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/zerofoot_model.py'
      - 'data/historical_matches.json'
      - '.github/workflows/model-validation.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run historical backtest
        run: python scripts/zerofoot_model.py
      - name: Save report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ZEROFOOT model validation'
            git push
          fi
